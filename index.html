<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXURA BROWSER</title>
  <style>
    :root {
      --bg-dark: #0a0d14;
      --panel-bg: rgba(18, 24, 38, 0.75);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7f00ff;
      --text-main: #f0f4f8;
      --text-dim: #8a99ad;
      --border-glow: rgba(0, 242, 254, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glow);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-author {
      font-size: 0.65rem;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 4px 8px 4px 14px;
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--border-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.9rem;
      padding: 6px 0;
    }

    .search-box button {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
      color: #000;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .search-box button:active {
      transform: scale(0.95);
    }

    /* Progress Indicator */
    .progress-bar {
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.3s ease;
    }

    /* Main Viewport */
    main {
      flex: 1;
      position: relative;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    /* Overlay Screen (Landing Page / Fallback State) */
    .dashboard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top right, #1a1c2e, var(--bg-dark));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    .dashboard.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .hero-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .hero-card h1 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-card p {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .tld-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }

    .chip {
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.2);
      color: var(--accent-cyan);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Bottom Status Bar */
    footer {
      background: var(--panel-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      font-size: 0.7rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00ff88;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 8px #00ff88;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-row">
      <div class="brand-title">NEXURA BROWSER</div>
      <div class="brand-author">CREATED BY MUHAMMAD TAQI</div>
    </div>
    <div class="search-box">
      <input type="text" id="urlInput" placeholder="Enter URL or search term (e.g. owner.taqi)..." autocomplete="off" spellcheck="false">
      <button onclick="handleNavigation()">GO</button>
    </div>
  </header>

  <div class="progress-bar" id="progressBar"></div>

  <main>
    <div class="dashboard" id="dashboard">
      <div class="hero-card">
        <h1>NEXURA OS</h1>
        <p>Custom TLD Resolver Engine active</p>
        <div class="tld-chips" id="tldContainer">
          <!-- Chips injected via JavaScript -->
        </div>
      </div>
    </div>
    <iframe id="browserFrame" src="about:blank"></iframe>
  </main>

  <footer>
    <div><span class="status-dot"></span><span id="syncStatus">Syncing Database...</span></div>
    <div>v1.0.0</div>
  </footer>

  <script>
    // Config: Dynamic JSON URL from external repository
    const RAW_JSON_URL = 'https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_DATA_REPO/main/data.json';

    let customTlds = [];
    let customDomains = {};

    // Synchronize Database from external Repository
    async function initDatabase() {
      const syncStatus = document.getElementById('syncStatus');
      try {
        const response = await fetch(RAW_JSON_URL + '?t=' + new Date().getTime());
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        
        customTlds = data.tlds || [];
        customDomains = data.domains || {};

        syncStatus.innerText = 'TLD Database Ready';
        renderTldChips();
      } catch (err) {
        console.warn('Fallback local cache used or error fetching data:', err);
        syncStatus.innerText = 'Offline Mode Active';
        
        // Fallback Defaults
        customTlds = [".taqi", ".sigma", ".lyra", ".taha", ".zf", ".king", ".queen", ".lucas", ".eu", ".mm"];
        customDomains = { "owner.taqi": "https://github.com" };
        renderTldChips();
      }
    }

    function renderTldChips() {
      const container = document.getElementById('tldContainer');
      container.innerHTML = customTlds.map(tld => `<span class="chip">${tld}</span>`).join('');
    }

    function handleNavigation() {
      const input = document.getElementById('urlInput').value.trim();
      const frame = document.getElementById('browserFrame');
      const dashboard = document.getElementById('dashboard');
      const progressBar = document.getElementById('progressBar');

      if (!input) return;

      progressBar.style.width = '30%';

      const normalizedInput = input.toLowerCase();

      // Check 1: Custom Exact Domain Match in JSON (e.g. owner.taqi)
      if (customDomains[normalizedInput]) {
        progressBar.style.width = '70%';
        frame.src = customDomains[normalizedInput];
        dashboard.classList.add('hidden');
        progressBar.style.width = '100%';
        setTimeout(() => { progressBar.style.width = '0%'; }, 300);
        return;
      }

      // Check 2: Check if string ends with any defined TLD
      const matchesCustomTLD = customTlds.some(tld => normalizedInput.endsWith(tld));

      if (matchesCustomTLD) {
        // TLD matched but no record exists in JSON -> Show search fallback
        const query = encodeURIComponent(input);
        frame.src = `https://www.google.com/search?q=${query}`;
      } else if (normalizedInput.startsWith('http://') || normalizedInput.startsWith('https://')) {
        // Direct Standard Web URL
        frame.src = normalizedInput;
      } else if (normalizedInput.includes('.') && !normalizedInput.includes(' ')) {
        // Standard Web Domain (e.g., google.com)
        frame.src = `https://${normalizedInput}`;
      } else {
        // Fallback Google Search for plain text queries
        const query = encodeURIComponent(input);
        frame.src = `https://www.google.com/search?q=${query}`;
      }

      dashboard.classList.add('hidden');
      progressBar.style.width = '100%';
      setTimeout(() => { progressBar.style.width = '0%'; }, 300);
    }

    // Enter key trigger
    document.getElementById('urlInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') handleNavigation();
    });

    // Initialize application
    initDatabase();
  </script>
</body>
</html>
