name: Build NEXURA Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download & Setup Android Command Line Tools
        run: |
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          wget https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          sudo cp -r temp_tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Initialize Project Directory & Dependencies
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android sharp-cli

      - name: Initialize Capacitor Platform
        run: |
          npx cap init "NEXURA BROWSER" "com.nexura.browser" --web-dir www
          npx cap add android

      - name: Generate and Inject Custom App Icons from icon.png
        run: |
          if [ -f "icon.png" ]; then
            echo "Processing custom icon.png..."
            RES_DIR="android/app/src/main/res"
            
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-mdpi/ic_launcher.png resize 48 48 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-hdpi/ic_launcher.png resize 72 72 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-xhdpi/ic_launcher.png resize 96 96 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-xxhdpi/ic_launcher.png resize 144 144 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-xxxhdpi/ic_launcher.png resize 192 192 --fit cover || true

            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-mdpi/ic_launcher_round.png resize 48 48 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-hdpi/ic_launcher_round.png resize 72 72 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-xhdpi/ic_launcher_round.png resize 96 96 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png resize 144 144 --fit cover || true
            npx sharp-cli -i icon.png -o $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png resize 192 192 --fit cover || true
          else
            echo "icon.png not found, skipping."
          fi

      - name: Configure Android Cleartext Traffic
        run: |
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Sync Capacitor Web Assets
        run: |
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXURA-Browser-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
